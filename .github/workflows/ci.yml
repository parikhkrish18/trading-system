name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    # Several integration tests intentionally hit real Postgres because the
    # ingest path uses Postgres-specific INSERT ... SELECT ... ON CONFLICT
    # semantics. The service container starts empty, so CI must apply the
    # same ordered schema migrations production/local setup uses before
    # pytest touches tables such as news_events and universe.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: trading
          POSTGRES_PASSWORD: change_me_locally
          POSTGRES_DB: trading
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Initialize database schema
        env:
          PGPASSWORD: change_me_locally
        run: |
          for migration in data/schema/*.sql; do
            echo "Applying ${migration}"
            psql -v ON_ERROR_STOP=1 -h localhost -U trading -d trading -f "${migration}"
          done

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: pytest -v
